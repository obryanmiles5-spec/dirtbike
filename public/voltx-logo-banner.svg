<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="30%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <filter id="limeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="50%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative Electric Lines -->
  <path d="M 0 550 L 1200 550" stroke="#1e293b" stroke-width="2"/>
  <path d="M 0 550 L 400 550" stroke="#a3e635" stroke-width="4" opacity="0.8"/>
  <path d="M 800 550 L 1200 550" stroke="#06b6d4" stroke-width="4" opacity="0.8"/>

  <!-- Left Icon Emblem (Center Y ~ 315) -->
  <g transform="translate(140, 115) scale(0.8)">
    <!-- Shield -->
    <polygon points="256,64 390,136 390,290 256,368 122,290 122,136" fill="#0f172a" stroke="#334155" stroke-width="5"/>
    <polygon points="256,76 378,142 378,284 256,356 134,284 134,142" fill="none" stroke="url(#limeGrad)" stroke-width="3" opacity="0.5"/>

    <!-- Lightning V -->
    <g filter="url(#limeGlow)">
      <path d="M 160 140 L 220 140 L 256 265 L 228 265 Z" fill="url(#limeGrad)" />
      <path d="M 352 140 L 292 140 L 256 265 L 284 265 Z" fill="url(#limeGrad)" />
      <path d="M 275 110 L 210 230 L 252 230 L 230 330 L 305 195 L 260 195 Z" fill="url(#limeGrad)" stroke="#ffffff" stroke-width="2"/>
    </g>
  </g>

  <!-- Right Typography -->
  <text x="540" y="310" font-family="'Inter', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="110" fill="#ffffff" letter-spacing="12">
    VOLT<tspan fill="#a3e635">X</tspan>
  </text>

  <text x="545" y="380" font-family="'Inter', 'Arial', sans-serif" font-weight="800" font-size="36" fill="#06b6d4" letter-spacing="18">
    MOTORSPORTS
  </text>

  <text x="548" y="430" font-family="'Inter', 'Arial', sans-serif" font-weight="600" font-size="20" fill="#94a3b8" letter-spacing="4">
    ELECTRIC DIRT BIKES &amp; E-BIKES
  </text>
</svg>
