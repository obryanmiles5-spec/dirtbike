<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#121927"/>
      <stop offset="100%" stop-color="#05080e"/>
    </radialGradient>
    <linearGradient id="lime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9f99d"/>
      <stop offset="50%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="90" fill="none" stroke="#a3e635" stroke-width="8" opacity="0.3"/>
  <rect x="36" y="36" width="440" height="440" rx="74" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.2"/>

  <!-- Geometric Hexagon Badge -->
  <polygon points="256,60 410,140 410,320 256,420 102,320 102,140" fill="#0f172a" stroke="#334155" stroke-width="8"/>
  <polygon points="256,80 390,150 390,310 256,400 122,310 122,150" fill="none" stroke="url(#lime)" stroke-width="4" opacity="0.6"/>

  <!-- High-Output Lightning 'V' Emblem -->
  <g filter="url(#glow)">
    <!-- V Left Wing -->
    <polygon points="155,145 220,145 256,280 220,280" fill="url(#lime)" />
    <!-- V Right Wing -->
    <polygon points="357,145 292,145 256,280 292,280" fill="url(#lime)" />
    <!-- Lightning Bolt Overlay -->
    <polygon points="280,110 200,245 250,245 220,360 312,205 260,205" fill="url(#lime)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Voltage Pulse Dots -->
  <circle cx="155" cy="145" r="10" fill="#38bdf8"/>
  <circle cx="357" cy="145" r="10" fill="#38bdf8"/>
  <circle cx="220" cy="360" r="8" fill="#a3e635"/>
</svg>
