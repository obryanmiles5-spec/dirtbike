<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#121824"/>
      <stop offset="60%" stop-color="#090d14"/>
      <stop offset="100%" stop-color="#030508"/>
    </radialGradient>

    <!-- Lime Glow Filter -->
    <filter id="limeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Lime Gradient -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="50%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>

    <!-- Cyan/Metallic Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Carbon Dark Plate Gradient -->
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <!-- Subtle Outer Neon Ring -->
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="url(#borderGrad)" stroke-width="6" opacity="0.85"/>

  <!-- Geometric Hexagon Shield Badge -->
  <polygon points="256,64 390,136 390,290 256,368 122,290 122,136" fill="url(#plateGrad)" stroke="#334155" stroke-width="4"/>
  <polygon points="256,76 378,142 378,284 256,356 134,284 134,142" fill="none" stroke="url(#limeGrad)" stroke-width="2" opacity="0.4"/>

  <!-- Central Electric 'V' Lightning Symbol -->
  <g filter="url(#limeGlow)">
    <!-- Left wing of V -->
    <path d="M 160 140 L 220 140 L 256 265 L 228 265 Z" fill="url(#limeGrad)" />
    
    <!-- Right wing of V -->
    <path d="M 352 140 L 292 140 L 256 265 L 284 265 Z" fill="url(#limeGrad)" />

    <!-- Lightning Bolt Cutout Over V -->
    <path d="M 275 110 L 210 230 L 252 230 L 230 330 L 305 195 L 260 195 Z" fill="url(#limeGrad)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Cyan Electric Sparks Accent -->
  <circle cx="160" cy="140" r="6" fill="#38bdf8" />
  <circle cx="352" cy="140" r="6" fill="#38bdf8" />
  <path d="M 130 160 L 150 150" stroke="url(#cyanGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 382 160 L 362 150" stroke="url(#cyanGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- Brand Typography -->
  <text x="256" y="420" text-anchor="middle" font-family="'Inter', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="42" fill="#ffffff" letter-spacing="8">
    VOLT<tspan fill="#a3e635">X</tspan>
  </text>
  <text x="256" y="450" text-anchor="middle" font-family="'Inter', 'Arial', sans-serif" font-weight="800" font-size="16" fill="#94a3b8" letter-spacing="10">
    MOTORSPORTS
  </text>
</svg>
